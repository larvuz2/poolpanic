# Netlify: import this repository once (Add new site → Import an existing project → GitHub) and every push
# to the production branch deploys automatically, with a deploy preview for each pull request. All build
# settings live here, so the site settings in the Netlify UI can stay on their defaults.
[build]
  # The game is static and ships as-is from dist/ (no bundling). The build step stamps the commit into
  # dist/version.mjs (so crash reports name it) and runs the regression checks, so a change that breaks them fails
  # its deploy instead of going live.
  command = "node stamp-version.mjs && npm test"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The one function the site has: the crash-report sink the game posts its crash log to (netlify/functions/report.mjs,
# served at /api/report, stored in Netlify Blobs). Netlify bundles it with the @netlify/blobs package from
# package.json; the game itself stays unbundled.
[functions]
  directory = "netlify/functions"

# The game loads as native ES modules, which browsers only run when served with a JavaScript MIME type.
[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
